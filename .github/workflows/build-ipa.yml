name: Build unsigned IPA (Personal & Public)

on:
  workflow_dispatch:
  # 安全合规：彻底关闭 push 自动触发，杜绝短时间内并发高频挤占 macOS 免费算力导致账号风控
  # push:
  #   branches: [ main, master, personal ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          MARKETING="$(tr -d '[:space:]' < VERSION)"
          [ -n "$MARKETING" ] || { echo "VERSION file is empty"; exit 1; }
          BUILD="${{ github.run_number }}"
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Version: $MARKETING ($BUILD)"

      # ==========================================
      # 1. 编译打包：个人版（包含完整内网/外网穿透配置与凭据）
      # ==========================================
      - name: Build Personal Edition (Archive)
        run: |
          rm -rf build Payload
          xcodebuild archive \
            -project DSHios.xcodeproj \
            -scheme DSHios \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DSHios-personal.xcarchive \
            MARKETING_VERSION="${{ steps.ver.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: Package Personal IPA
        run: |
          APP="build/DSHios-personal.xcarchive/Products/Applications/DSHios.app"
          test -d "$APP" || { echo "missing $APP"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/DSHios.app
          rm -rf Payload/DSHios.app/_CodeSignature 2>/dev/null || true
          rm -f  Payload/DSHios.app/embedded.mobileprovision 2>/dev/null || true
          zip -qry DSHios-personal-unsigned.ipa Payload
          cp DSHios-personal-unsigned.ipa "DSHios-personal-${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}.ipa"
          cp DSHios-personal-unsigned.ipa "DSHios-personal-${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}.tipa"
          cp DSHios-personal-unsigned.ipa DSHios-personal-unsigned.tipa
          ls -lh DSHios-personal-*.ipa DSHios-personal-*.tipa

      # ==========================================
      # 2. 编译打包：公开发行版（纯净版，剔除外网地址与密钥）
      # ==========================================
      - name: Build Public Edition (Archive)
        run: |
          rm -rf build Payload
          xcodebuild archive \
            -project DSHios.xcodeproj \
            -scheme DSHios \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DSHios-public.xcarchive \
            MARKETING_VERSION="${{ steps.ver.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="PUBLIC_BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: Package Public IPA
        run: |
          APP="build/DSHios-public.xcarchive/Products/Applications/DSHios.app"
          test -d "$APP" || { echo "missing $APP"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/DSHios.app
          rm -rf Payload/DSHios.app/_CodeSignature 2>/dev/null || true
          rm -f  Payload/DSHios.app/embedded.mobileprovision 2>/dev/null || true
          zip -qry DSHios-public-unsigned.ipa Payload
          cp DSHios-public-unsigned.ipa "DSHios-public-${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}.ipa"
          cp DSHios-public-unsigned.ipa "DSHios-public-${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}.tipa"
          cp DSHios-public-unsigned.ipa DSHios-public-unsigned.tipa
          ls -lh DSHios-public-*.ipa DSHios-public-*.tipa

      # 默认通用名称（兼容以往老脚本取名习惯，默认使用个人版）
      - name: Prepare default alias
        run: |
          cp DSHios-personal-unsigned.ipa DSHios-unsigned.ipa
          cp DSHios-personal-unsigned.ipa DSHios-unsigned.tipa

      - name: Upload Personal IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSHios-personal-${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}
          path: |
            DSHios-personal-unsigned.ipa
            DSHios-personal-unsigned.tipa
          if-no-files-found: error

      - name: Upload Public IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSHios-public-${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}
          path: |
            DSHios-public-unsigned.ipa
            DSHios-public-unsigned.tipa
          if-no-files-found: error

      - name: Upload Standard IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSHios-unsigned-ipa
          path: |
            DSHios-unsigned.ipa
            DSHios-unsigned.tipa
          if-no-files-found: error
