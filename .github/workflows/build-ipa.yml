name: Build unsigned IPA (Public Clean Edition)

on:
  workflow_dispatch:
  # 安全合规：彻底关闭 push 自动触发，杜绝短时间内并发高频挤占 macOS 免费算力导致账号风控
  # push:
  #   branches: [ main, master, personal ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          MARKETING="$(tr -d '[:space:]' < VERSION)"
          [ -n "$MARKETING" ] || { echo "VERSION file is empty"; exit 1; }
          BUILD="${{ github.run_number }}"
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Version: $MARKETING ($BUILD)"

      # ==========================================
      # 发布凭证校验：没跑回归闸门 / 闸门没全绿 / 跑完又改代码 → 一律拒绝打包
      # （根治「同一个问题修完又复发」的流程层漏洞，详见 REGRESSION.md 第八节）
      # ==========================================
      - name: Verify regression gate
        run: python3 _diag/verify_gate.py


      # ==========================================
      # 编译打包：全网统一纯净公开版（零个人私密信息与外网穿透）
      # ==========================================
      - name: Build Public Edition (Archive)
        run: |
          rm -rf build Payload
          xcodebuild archive \
            -project DSHios.xcodeproj \
            -scheme DSHios \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DSHios-public.xcarchive \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="PUBLIC_BUILD" \
            MARKETING_VERSION="${{ steps.ver.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: Package Public IPA
        run: |
          APP="build/DSHios-public.xcarchive/Products/Applications/DSHios.app"
          test -d "$APP" || { echo "missing $APP"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/DSHios.app
          rm -rf Payload/DSHios.app/_CodeSignature 2>/dev/null || true
          rm -f  Payload/DSHios.app/embedded.mobileprovision 2>/dev/null || true
          zip -qry DSHios-public-unsigned.ipa Payload
          cp DSHios-public-unsigned.ipa "DSHios-public-${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}.ipa"
          cp DSHios-public-unsigned.ipa "DSHios-public-${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}.tipa"
          cp DSHios-public-unsigned.ipa DSHios-public-unsigned.tipa
          # 兼容通用别名
          cp DSHios-public-unsigned.ipa DSHios-unsigned.ipa
          cp DSHios-public-unsigned.ipa DSHios-unsigned.tipa
          ls -lh DSHios-public-*.ipa DSHios-public-*.tipa

      - name: Upload Public IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSHios-public-${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}
          path: |
            DSHios-public-unsigned.ipa
            DSHios-public-unsigned.tipa
            DSHios-unsigned.ipa
            DSHios-unsigned.tipa
          if-no-files-found: error
