name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build unsigned (archive)
        run: |
          xcodebuild archive \
            -project DSHios.xcodeproj \
            -scheme DSHios \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DSHios.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: Package Payload -> unsigned IPA
        run: |
          APP="build/DSHios.xcarchive/Products/Applications/DSHios.app"
          test -d "$APP" || { echo "missing $APP"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/DSHios.app
          rm -rf Payload/DSHios.app/_CodeSignature 2>/dev/null || true
          rm -f  Payload/DSHios.app/embedded.mobileprovision 2>/dev/null || true
          zip -qry DSHios-unsigned.ipa Payload
          ls -lh DSHios-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSHios-unsigned-ipa
          path: DSHios-unsigned.ipa
          if-no-files-found: error
