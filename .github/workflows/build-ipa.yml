name: Build unsigned IPA (Public Clean Edition)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          MARKETING="$(tr -d '[:space:]' < VERSION)"
          [ -n "$MARKETING" ] || { echo "VERSION file is empty"; exit 1; }
          BUILD="${{ github.run_number }}"
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Version: $MARKETING ($BUILD)"

      # ==========================================
      # 纯净公开版编译打包（100% 零凭据、零密钥）
      # ==========================================
      - name: Archive public clean
        run: |
          rm -rf build Payload dist
          mkdir -p dist
          xcodebuild archive \
            -project ios-mcp-agent.xcodeproj \
            -scheme ios-mcp-agent \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/public.xcarchive \
            MARKETING_VERSION="${{ steps.ver.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO
          bash scripts/pack-ipa.sh build/public.xcarchive "dist/ios-mcp-agent-public-${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}.ipa"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-mcp-agent-public-${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}
          path: |
            dist/*.ipa
            dist/*.tipa
          if-no-files-found: error
