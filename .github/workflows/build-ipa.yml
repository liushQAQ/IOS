name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          # VERSION 文件是"展示版本"的唯一来源（如 1.0.4）；构建号自动用本次 run 号，永不重复。
          MARKETING="$(tr -d '[:space:]' < VERSION)"
          [ -n "$MARKETING" ] || { echo "VERSION file is empty"; exit 1; }
          BUILD="${{ github.run_number }}"
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Version: $MARKETING ($BUILD)"

      - name: Build unsigned (archive)
        run: |
          xcodebuild archive \
            -project DSHios.xcodeproj \
            -scheme DSHios \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DSHios.xcarchive \
            MARKETING_VERSION="${{ steps.ver.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: Package Payload -> unsigned IPA
        run: |
          APP="build/DSHios.xcarchive/Products/Applications/DSHios.app"
          test -d "$APP" || { echo "missing $APP"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/DSHios.app
          rm -rf Payload/DSHios.app/_CodeSignature 2>/dev/null || true
          rm -f  Payload/DSHios.app/embedded.mobileprovision 2>/dev/null || true
          zip -qry DSHios-unsigned.ipa Payload
          ls -lh DSHios-unsigned.ipa

      - name: Name artifact with version
        run: |
          set -euo pipefail
          NAME="DSHios-unsigned-${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}.ipa"
          cp DSHios-unsigned.ipa "$NAME"
          echo "Artifact: $NAME"
          echo "artifact_name=$NAME" >> "$GITHUB_OUTPUT"
        id: name

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSHios-unsigned-ipa
          path: DSHios-unsigned.ipa
          if-no-files-found: error

      - name: Upload versioned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact_name }}
          path: ${{ steps.name.outputs.artifact_name }}
          if-no-files-found: error
