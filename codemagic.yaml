workflows:
  dsh-ios-build:
    name: DeepSeek Harness iOS (unsigned IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        SCHEME: DSHios
    scripts:
      - name: Resolve version
        script: |
          set -e
          MARKETING="$(tr -d '[:space:]' < VERSION)"
          [ -n "$MARKETING" ] || { echo "VERSION file is empty"; exit 1; }
          BUILD="${BUILD_NUMBER:-$(date +%Y%m%d%H%M)}"
          echo "MARKETING=$MARKETING" >> "$CM_ENV"
          echo "BUILD=$BUILD" >> "$CM_ENV"
          echo "Version: $MARKETING ($BUILD)"

      # 与 GitHub Actions 同款发布凭证校验：闸门没全绿 / 跑完又改代码，一律拒绝打包
      - name: Verify regression gate
        script: python3 _diag/verify_gate.py

      - name: Archive (unsigned)
        script: |
          set -e
          rm -rf build Payload
          xcodebuild archive \
            -project DSHios.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DSHios.xcarchive \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="PUBLIC_BUILD" \
            MARKETING_VERSION="$MARKETING" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: Package Payload -> unsigned IPA
        script: |
          set -e
          APP="build/DSHios.xcarchive/Products/Applications/DSHios.app"
          test -d "$APP" || { echo "missing $APP"; exit 1; }
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/DSHios.app
          rm -rf Payload/DSHios.app/_CodeSignature 2>/dev/null || true
          rm -f  Payload/DSHios.app/embedded.mobileprovision 2>/dev/null || true
          zip -qry DSHios-unsigned.ipa Payload
          cp DSHios-unsigned.ipa "DSHios-public-${MARKETING}-${BUILD}.ipa"
          cp DSHios-unsigned.ipa "DSHios-public-${MARKETING}-${BUILD}.tipa"
          cp DSHios-unsigned.ipa DSHios-unsigned.tipa
          ls -lh DSHios-unsigned.ipa DSHios-public-*.tipa

    artifacts:
      - DSHios-unsigned.ipa
      - DSHios-unsigned.tipa
      - DSHios-public-*.ipa
      - DSHios-public-*.tipa
